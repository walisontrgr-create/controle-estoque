services:
  mysql:
    image: mysql:8.0
    container_name: estoque-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: senha123
      MYSQL_DATABASE: estoque_db
    ports:
      - "3306:3306"
    volumes:
      - estoque-mysql-data:/var/lib/mysql

volumes:
  estoque-mysql-data: